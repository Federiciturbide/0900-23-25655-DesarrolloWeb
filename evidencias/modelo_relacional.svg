<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900">
 <rect width="1320" height="900" fill="#f7f7f7"/>
 <text x="42" y="48" font-family="Arial" font-size="28" font-weight="700" fill="#333">Modelo relacional · La casa del rincón guatemalteco</text>
 <text x="42" y="77" font-family="Arial" font-size="15" fill="#777">Tablas persistentes SQLite para acceso, catálogos, ventas, inventario, caja, facturas y reportes</text>
 <g font-family="Arial">
  <rect x="38" y="110" width="386" height="520" rx="2" fill="#fff" stroke="#bbb"/>
  <rect x="38" y="110" width="386" height="36" fill="#d87521"/>
  <text x="54" y="134" font-size="17" font-weight="700" fill="#fff">Acceso y catálogos</text>
  <text x="58" y="180" font-size="14" fill="#333">users — cuentas de usuario</text>
  <text x="58" y="206" font-size="14" fill="#333">sessions — sesiones y vencimiento</text>
  <text x="58" y="244" font-size="14" fill="#333">clients — NIT, contacto y puntos</text>
  <text x="58" y="270" font-size="14" fill="#333">suppliers — empresas y contactos</text>
  <text x="58" y="308" font-size="14" fill="#333">products — SKU, familia, stock</text>
  <text x="58" y="334" font-size="14" fill="#333">product_prices — costo y precio</text>
  <text x="58" y="372" font-size="14" fill="#333">promotions — reglas y vigencia</text>
  <text x="58" y="410" font-size="14" fill="#333">catalog_audit — historial de cambios</text>
  <text x="58" y="465" font-size="13" fill="#777">Relaciones:</text>
  <text x="58" y="489" font-size="13" fill="#555">products → suppliers</text>
  <text x="58" y="513" font-size="13" fill="#555">product_prices → products</text>
  <text x="58" y="537" font-size="13" fill="#555">promotions → products (opcional)</text>
  <text x="58" y="561" font-size="13" fill="#555">users → sessions, catalog_audit</text>

  <rect x="466" y="110" width="386" height="520" rx="2" fill="#fff" stroke="#bbb"/>
  <rect x="466" y="110" width="386" height="36" fill="#d87521"/>
  <text x="482" y="134" font-size="17" font-weight="700" fill="#fff">Ventas, caja y facturación</text>
  <text x="486" y="180" font-size="14" fill="#333">cash_registers — apertura y cierre</text>
  <text x="486" y="218" font-size="14" fill="#333">sales — cliente, cobro y totales</text>
  <text x="486" y="244" font-size="14" fill="#333">sale_lines — productos y cantidades</text>
  <text x="486" y="282" font-size="14" fill="#333">invoices — factura y QR</text>
  <text x="486" y="320" font-size="14" fill="#333">returns — daño, vencimiento, reembolso</text>
  <text x="486" y="358" font-size="14" fill="#333">vouchers — vales emitidos y usados</text>
  <text x="486" y="396" font-size="14" fill="#333">loyalty_transactions — puntos</text>
  <text x="486" y="465" font-size="13" fill="#777">Relaciones:</text>
  <text x="486" y="489" font-size="13" fill="#555">sales → clients, cash_registers, users</text>
  <text x="486" y="513" font-size="13" fill="#555">sale_lines → sales, products, promotions</text>
  <text x="486" y="537" font-size="13" fill="#555">invoices → sales (una factura por venta)</text>
  <text x="486" y="561" font-size="13" fill="#555">returns → venta, línea y caja</text>
  <text x="486" y="585" font-size="13" fill="#555">vouchers / points → cliente y venta</text>

  <rect x="894" y="110" width="386" height="520" rx="2" fill="#fff" stroke="#bbb"/>
  <rect x="894" y="110" width="386" height="36" fill="#d87521"/>
  <text x="910" y="134" font-size="17" font-weight="700" fill="#fff">Compras e inventario</text>
  <text x="914" y="180" font-size="14" fill="#333">purchases — proveedor, fecha y total</text>
  <text x="914" y="206" font-size="14" fill="#333">purchase_lines — producto y costo</text>
  <text x="914" y="262" font-size="13" fill="#777">Relaciones:</text>
  <text x="914" y="286" font-size="13" fill="#555">purchases → suppliers, users</text>
  <text x="914" y="310" font-size="13" fill="#555">purchase_lines → purchases, products</text>
  <text x="914" y="368" font-size="13" fill="#777">Al registrar una compra:</text>
  <text x="914" y="394" font-size="13" fill="#555">• incrementa la existencia del producto</text>
  <text x="914" y="418" font-size="13" fill="#555">• guarda unidades, costo y subtotal</text>
  <text x="914" y="442" font-size="13" fill="#555">• conserva el historial de precios</text>
  <text x="914" y="500" font-size="13" fill="#777">Las devoluciones por daño o vencimiento</text>
  <text x="914" y="524" font-size="13" fill="#777">se registran en returns y no reingresan</text>
  <text x="914" y="548" font-size="13" fill="#777">a las existencias vendibles.</text>

  <rect x="38" y="665" width="1242" height="180" rx="2" fill="#fff" stroke="#bbb"/>
  <rect x="38" y="665" width="1242" height="36" fill="#eee"/>
  <text x="54" y="689" font-size="17" font-weight="700" fill="#444">Reglas de integridad</text>
  <text x="58" y="735" font-size="14" fill="#444">• Las relaciones usan llaves foráneas; los códigos de cliente, proveedor, SKU, promoción, venta, factura y devolución son únicos.</text>
  <text x="58" y="765" font-size="14" fill="#444">• Solo se permite una caja abierta; las existencias y puntos no pueden ser negativos.</text>
  <text x="58" y="795" font-size="14" fill="#444">• Las facturas guardan el contenido QR y la promoción vinculada para su consulta posterior.</text>
  <text x="58" y="825" font-size="14" fill="#666">El detalle completo, restricciones e índices están en ESQUEMA_BD.sql.</text>
 </g>
</svg>
